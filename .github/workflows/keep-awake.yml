# Backup for the server's own keep-awake ping: visit the live site every 10 minutes so
# Render's free plan never puts it to sleep. Free for public repos.
# (GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days without
# any repo activity — it emails you, and one click re-enables it.)
name: Keep the game awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Visit the live site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://pictonary-egk7.onrender.com' }}
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 15 "$SITE_URL/health"
