# One-click deploy on Render's free plan: https://render.com/deploy
services:
  - type: web
    name: pictonary
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Accounts, stars and cards need a database that survives restarts.
      # Paste a free Neon Postgres connection string (https://neon.tech) when Render asks.
      - key: DATABASE_URL
        sync: false
